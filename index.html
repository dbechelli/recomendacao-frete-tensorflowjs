<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recomendação de Frete — TensorFlow.js</title>
  <!-- TensorFlow.js via CDN (mesmo padrão do exemplo da aula) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <!-- tfjs-vis: painel com gráfico de MAE ao vivo por época (mesmo padrão do exemplo da aula) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis@1.5.1/dist/tfjs-vis.umd.min.js"></script>
  <style>
    :root { --azul:#1f6feb; --verde:#1a7f37; --vermelho:#cf222e; --cinza:#57606a; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 2rem; color:#1f2328; background:#f6f8fa; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    p.sub { color: var(--cinza); margin-top: 0; }
    #status { padding:.6rem .9rem; background:#fff; border:1px solid #d0d7de; border-radius:8px; font-weight:600; }
    #log { font-family: ui-monospace, monospace; color: var(--cinza); font-size:.8rem; min-height:1.2em; margin:.4rem 0 1rem; }
    form { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:.75rem; background:#fff; padding:1rem; border:1px solid #d0d7de; border-radius:8px; margin-bottom:1rem; }
    label { display:flex; flex-direction:column; font-size:.8rem; color:var(--cinza); gap:.25rem; }
    input, select { padding:.4rem; border:1px solid #d0d7de; border-radius:6px; font-size:.9rem; }
    .full { grid-column: 1 / -1; display:flex; align-items:center; gap:1rem; }
    button { background:var(--azul); color:#fff; border:0; padding:.55rem 1.1rem; border-radius:6px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .avaliacao { background:#fff; border:1px solid #d0d7de; border-radius:8px; padding:1rem 1.2rem; margin-bottom:1rem; }
    .avaliacao h2 { font-size:1rem; margin:0 0 .2rem; }
    .metricas { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap:1rem; margin-top:.5rem; }
    .metrica { display:flex; flex-direction:column; gap:.2rem; }
    .metrica .rotulo { font-size:.72rem; color:var(--cinza); text-transform:uppercase; letter-spacing:.03em; }
    .metrica strong { font-size:1.35rem; }
    .rota-info { background:#fff; border:1px solid #d0d7de; border-radius:8px; padding:.6rem 1rem; margin-bottom:1rem; font-size:.85rem; }
    table { width:100%; border-collapse:collapse; background:#fff; border:1px solid #d0d7de; border-radius:8px; overflow:hidden; }
    th, td { text-align:left; padding:.6rem .8rem; border-bottom:1px solid #eaeef2; font-size:.9rem; }
    th { background:#f6f8fa; font-size:.75rem; text-transform:uppercase; letter-spacing:.03em; color:var(--cinza); }
    tr.recomendada { background:#eaf6ec; }
    .badge { background:var(--verde); color:#fff; font-size:.7rem; padding:.1rem .4rem; border-radius:4px; margin-left:.3rem; }
    .alerta { color:var(--vermelho); font-weight:600; }
    .ok { color:var(--verde); font-weight:600; }
    small { color:var(--cinza); }
    details summary { cursor:pointer; color:var(--azul); font-size:.78rem; font-weight:600; padding:.4rem .8rem; }
    details[open] summary { border-bottom:1px solid #eaeef2; }
    .historia { padding:.6rem .8rem .8rem; font-size:.82rem; line-height:1.55; color:#1f2328; }
    .historia strong { color:var(--azul); }
    .historia ul.entradas { list-style:none; margin:.3rem 0; padding:.5rem .7rem; background:#f6f8fa; border:1px solid #eaeef2; border-radius:6px; font-family:ui-monospace, monospace; font-size:.76rem; }
    .historia ul.entradas li { padding:.1rem 0; }
  </style>
</head>
<body>
  <h1>Recomendação de Frete por Confiabilidade</h1>
  <p class="sub">ETA real previsto com TensorFlow.js — Exercício 01 / Pós Engenharia de IA</p>

  <div id="status">Iniciando...</div>
  <div id="log"></div>

  <form id="form-cotacao">
    <label>CEP origem<input name="cep_origem" type="text" value="01310-100" placeholder="00000-000" required /></label>
    <label>CEP destino<input name="cep_destino" type="text" value="90010-150" placeholder="00000-000" required /></label>
    <label>Zona
      <select name="zona_rural"><option value="0">Urbana</option><option value="1" selected>Rural</option></select>
    </label>
    <label>Tipo de carga
      <select name="tipo_carga"><option value="fracionada" selected>Fracionada</option><option value="lotacao">Lotação</option></select>
    </label>
    <label>Peso (kg)<input name="peso" type="number" value="180" min="1" /></label>
    <label>Volume (m³)<input name="volume" type="number" step="0.01" value="0.8" /></label>
    <div class="full">
      <label style="flex-direction:row; align-items:center;">
        <input type="checkbox" name="pontualidade" checked /> Cliente exige pontualidade
      </label>
      <button type="submit" disabled>Cotar</button>
    </div>
  </form>

  <div id="avaliacao" class="avaliacao"></div>

  <div id="rota-info" class="rota-info"></div>

  <table id="tabela">
    <thead>
      <tr>
        <th>Transportadora</th><th>Preço tabela</th><th>Prazo tabela</th>
        <th>ETA previsto (IA)</th><th>Risco de atraso</th><th>Incerteza</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Chave da Google Maps API (gitignorado) — veja js/config.example.js -->
  <script src="js/config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
